<main class="shell">
  <cli class="terminal" [options]="options" [modules]="modules" (engineReady)="onEngineReady($event)" />
  @if (showKeys()) {
    <app-extra-keys (key)="onExtraKey($event)" />
  }
</main>
@if (updateReady()) {
  <div class="update" role="status">
    <button type="button" class="update-reload" (click)="reload()">A new version is ready. Tap to reload.</button>
    <button type="button" class="update-dismiss" aria-label="Dismiss" (click)="updateReady.set(false)">✕</button>
  </div>
}
