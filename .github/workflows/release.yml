name: Release

# Pushes to main publish the PWA to GitHub Pages and promote the build testers
# already have (uploaded from develop by ci.yml) to Play production. Nothing is
# rebuilt: production gets exactly the bundle that was tested. Set the
# PLAY_PRODUCTION_ROLLOUT variable (e.g. 0.2) for a staged rollout. See PLAY_STORE.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Build and end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  pages:
    name: Publish PWA to GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      # Project pages live under /<repo>/, custom domains at /.
      - run: npx ng build --base-href "${{ steps.pages.outputs.base_path }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pwa-cli/browser
      - id: deploy
        uses: actions/deploy-pages@v4

  # Each native platform gets its own production job (iOS: App Store, later).
  android-production:
    name: Promote to Play production
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: play-upload
      cancel-in-progress: false
    environment:
      name: play-production
      url: https://play.google.com/store/apps/details?id=com.qodalis.cli
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Restore Play key
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not set; see PLAY_STORE.md"
            exit 1
          fi
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play.json"
          echo "PLAY_JSON_KEY=$RUNNER_TEMP/play.json" >> "$GITHUB_ENV"
      - run: bundle exec fastlane production rollout:${{ vars.PLAY_PRODUCTION_ROLLOUT || '1' }}
