version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      # The CLI packages are released together; bump them in one PR.
      qodalis:
        patterns: ['@qodalis/*']
      angular:
        patterns: ['@angular/*', '@angular-devkit/*']
      capacitor:
        patterns: ['@capacitor/*']
    ignore:
      # Angular pins TypeScript to one minor (22.x: >=6.0 <6.1); it moves with
      # the Angular upgrade, which is planned by hand.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
